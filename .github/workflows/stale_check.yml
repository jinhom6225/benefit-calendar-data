name: stale-check

# Weekly data freshness check (research.md §5 "14일 규칙", Q3 A): rounds that
# are open now or open within 30 days and whose lastChecked is more than 10
# days old -> one Telegram message "[신청달력] 확인 필요 N건" with the round
# ids. Nothing is sent when every round is fresh. A failed run sends a short
# failure notice. Secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID (if unset the
# message is only printed in the log). tools/stale_check.py caps the text at
# 3000 characters, so it is sent as is (a byte cut here could split a Korean
# character and Telegram would refuse it). Never turn on shell tracing here.

on:
  schedule:
    - cron: "17 0 * * 1"  # Monday 09:17 KST (Monday 00:17 UTC)
  workflow_dispatch:

permissions: {}

jobs:
  stale-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -I -m unittest discover -s tests

      - name: Find stale rounds
        run: python -I tools/stale_check.py schedule.json --message-file "${RUNNER_TEMP}/stale.txt"

      - name: Telegram notice
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          message_file="${RUNNER_TEMP}/stale.txt"
          if [ "${STATUS}" != "success" ]; then
            text="$(printf '❌ [신청달력] 데이터 점검 실패 (%s)\n%s' "${STATUS}" "${RUN_URL}")"
          elif [ -f "${message_file}" ]; then
            text="$(cat "${message_file}")"
          else
            echo "No stale rounds; nothing to send."
            exit 0
          fi
          echo "${text}"
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not set; Telegram notices are off"
            exit 0
          fi
          curl --silent --show-error --fail --max-time 15 -o /dev/null \
            -d "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${text}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            || echo "::warning::Telegram send failed"
